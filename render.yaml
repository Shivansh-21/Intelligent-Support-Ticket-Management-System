databases:
  - name: technova-postgres
    databaseName: technova_support
    user: technova_user
    plan: free

services:
  - type: web
    name: technova-resolve
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: technova-resolve.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://technova-resolve.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: technova-postgres
          property: connectionString
      - key: PORT
        value: "8000"



