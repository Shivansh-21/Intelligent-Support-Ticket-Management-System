databases:
  - name: support-ticket-db
    plan: free
    databaseName: support_db
    user: support_user

services:
  - type: web
    name: support-ticket-web
    runtime: python
    plan: free
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn support_system.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-ticket-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WEB_CONCURRENCY
        value: "4"
