{% extends "base.html" %}

{% block title %}Register | Support Desk{% endblock %}

{% block body %}
<main class="auth-shell">
    <section class="auth-brand">
        <div class="brand-mark">S</div>
        <div>
            <h1>Start clean.</h1>
            <p>Create an account and submit requests with automatic priority detection.</p>
        </div>
    </section>

    <section class="auth-panel">
        <form class="auth-box" id="registerForm">
            <p class="eyebrow">New account</p>
            <h2>Register</h2>

            <div id="registerAlert" class="alert"></div>

            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Create Account</button>

            <div class="form-footer">
                <span>Already registered?</span>
                <a href="/">Login</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById("registerForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearAlert("registerAlert");

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            await apiFetch("/api/register/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, email, password})
            });

            showAlert("registerAlert", "Account created. Redirecting to login.", "success");
            setTimeout(() => {
                window.location.href = "/";
            }, 900);
        } catch (error) {
            showAlert("registerAlert", error.message);
        }
    });
</script>
{% endblock %}
