{% extends "app_base.html" %}

{% block title %}Create Ticket | Support Desk{% endblock %}

{% block app_body %}
<main class="page">
    <section class="page-head">
        <div>
            <h1>Create Ticket</h1>
            <p>Submit a support request for review.</p>
        </div>
        <a class="btn btn-ghost" href="/tickets/">View Tickets</a>
    </section>

    <section class="surface">
        <form id="ticketForm">
            <div id="ticketAlert" class="alert"></div>

            <div class="field">
                <label for="title">Issue Title</label>
                <input id="title" name="title" maxlength="200" required>
            </div>

            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description" required></textarea>
            </div>

            <button class="btn btn-primary" type="submit">Submit Ticket</button>
        </form>
    </section>
</main>
{% endblock %}

{% block app_scripts %}
<script>
    document.getElementById("ticketForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearAlert("ticketAlert");

        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();

        if (!title || !description) {
            showAlert("ticketAlert", "Please fill all fields.");
            return;
        }

        try {
            await apiFetch("/api/tickets/", {
                method: "POST",
                headers: auth.headers(),
                body: JSON.stringify({title, description})
            });

            showAlert("ticketAlert", "Ticket created.", "success");
            setTimeout(() => {
                window.location.href = "/tickets/";
            }, 700);
        } catch (error) {
            showAlert("ticketAlert", error.message);
        }
    });
</script>
{% endblock %}
