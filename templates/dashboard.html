{% extends "app_base.html" %}

{% block title %}Dashboard | Support Desk{% endblock %}

{% block app_body %}
<main class="page">
    <section class="page-head">
        <div>
            <h1>Dashboard</h1>
            <p id="dashboardSubtitle">Ticket overview</p>
        </div>
        <a class="btn btn-primary" href="/create-ticket/">Create Ticket</a>
    </section>

    <section class="stats-grid">
        <button class="stat" type="button" onclick="goTickets('all')">
            <span>Total Tickets</span>
            <strong id="totalTickets">0</strong>
        </button>
        <button class="stat" type="button" onclick="goTickets('OPEN')">
            <span>Open</span>
            <strong id="openTickets">0</strong>
        </button>
        <button class="stat" type="button" onclick="goTickets('RESOLVED')">
            <span>Resolved</span>
            <strong id="resolvedTickets">0</strong>
        </button>
        <button class="stat" type="button" onclick="goTickets('HIGH')">
            <span>High Priority</span>
            <strong id="highPriorityTickets">0</strong>
        </button>
    </section>
</main>
{% endblock %}

{% block app_scripts %}
<script>
    async function loadDashboard() {
        try {
            const [stats, user] = await Promise.all([
                apiFetch("/api/dashboard/", {headers: auth.headers()}),
                apiFetch("/api/me/", {headers: auth.headers()})
            ]);

            document.getElementById("totalTickets").textContent = stats.total_tickets;
            document.getElementById("openTickets").textContent = stats.open_tickets;
            document.getElementById("resolvedTickets").textContent = stats.resolved_tickets;
            document.getElementById("highPriorityTickets").textContent = stats.high_priority_tickets;
            document.getElementById("dashboardSubtitle").textContent = user.is_staff
                ? "All support tickets"
                : "Your support tickets";
        } catch (error) {
            console.error(error);
        }
    }

    function goTickets(filter) {
        window.location.href = filter === "all" ? "/tickets/" : "/tickets/?filter=" + filter;
    }

    loadDashboard();
</script>
{% endblock %}
