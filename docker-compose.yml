services:
  db:
    image: postgres:16-alpine
    container_name: technova-db
    environment:
      POSTGRES_DB: technova_support
      POSTGRES_USER: technova_user
      POSTGRES_PASSWORD: technova_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova_user -d technova_support"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - support_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technova-backend
    command: >
      sh -c "python manage.py migrate --no-input &&
             gunicorn support_system.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-docker-development-secret-key}
      DEBUG: ${DEBUG:-"False"}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend,frontend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://technova_user:technova_password@db:5432/technova_support}

      # SMTP / email settings (set these in your environment or a .env file)
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    depends_on:
      - db
    expose:
      - "8000"
    networks:
      - support_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: technova-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - support_net

volumes:
  postgres_data:
    name: technova_resolve_postgres_data

networks:
  support_net:
    driver: bridge
